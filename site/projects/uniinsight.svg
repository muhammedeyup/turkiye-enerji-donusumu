<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="uniBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#19172c"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#uniBg)"/>
  <rect x="50" y="40" width="700" height="420" rx="16" fill="rgba(255,255,255,0.02)" stroke="rgba(139,92,246,0.3)" stroke-width="1.5"/>

  <!-- Top bar -->
  <circle cx="85" cy="70" r="5" fill="#ef4444"/>
  <circle cx="105" cy="70" r="5" fill="#f59e0b"/>
  <circle cx="125" cy="70" r="5" fill="#10b981"/>
  <text x="160" y="75" fill="#94a3b8" font-family="monospace" font-size="13">UniInsight // DuckDB &amp; SQL Academic Analytics Warehouse</text>

  <!-- Query chip -->
  <rect x="560" y="58" width="170" height="24" rx="6" fill="rgba(168,85,247,0.2)" stroke="rgba(168,85,247,0.4)"/>
  <text x="575" y="74" fill="#c084fc" font-family="monospace" font-size="11">EXEC TIME: 0.003s</text>

  <!-- SQL Code Snippet Box -->
  <rect x="90" y="110" width="340" height="150" rx="10" fill="rgba(13,16,28,0.9)" stroke="rgba(255,255,255,0.08)"/>
  <text x="110" y="140" fill="#a855f7" font-family="monospace" font-size="12">SELECT</text>
  <text x="165" y="140" fill="#e2e8f0" font-family="monospace" font-size="12">course_name, AVG(gpa)</text>
  <text x="110" y="165" fill="#a855f7" font-family="monospace" font-size="12">FROM</text>
  <text x="150" y="165" fill="#38bdf8" font-family="monospace" font-size="12">student_warehouse.enrollments</text>
  <text x="110" y="190" fill="#a855f7" font-family="monospace" font-size="12">GROUP BY</text>
  <text x="180" y="190" fill="#e2e8f0" font-family="monospace" font-size="12">course_name</text>
  <text x="110" y="215" fill="#a855f7" font-family="monospace" font-size="12">HAVING</text>
  <text x="165" y="215" fill="#e2e8f0" font-family="monospace" font-size="12">COUNT(*) &gt; 500;</text>
  <text x="110" y="242" fill="#34d399" font-family="monospace" font-size="11">&gt;&gt; 120,400 rows processed (DuckDB)</text>

  <!-- Data Distribution Curves / Donut Chart -->
  <circle cx="580" cy="220" r="70" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="26"/>
  <circle cx="580" cy="220" r="70" fill="none" stroke="#8b5cf6" stroke-width="26" stroke-dasharray="280 440" stroke-linecap="round"/>
  <circle cx="580" cy="220" r="70" fill="none" stroke="#06b6d4" stroke-width="26" stroke-dasharray="100 440" stroke-dashoffset="-290" stroke-linecap="round"/>
  <text x="555" y="226" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="18">88.5%</text>

  <!-- Table preview -->
  <rect x="90" y="280" width="620" height="150" rx="10" fill="rgba(13,16,28,0.9)" stroke="rgba(255,255,255,0.08)"/>
  <line x1="90" y1="315" x2="710" y2="315" stroke="rgba(255,255,255,0.08)"/>
  <text x="110" y="303" fill="#94a3b8" font-family="monospace" font-size="11">DEPARTMENT</text>
  <text x="290" y="303" fill="#94a3b8" font-family="monospace" font-size="11">ENROLLMENT</text>
  <text x="430" y="303" fill="#94a3b8" font-family="monospace" font-size="11">AVG GPA</text>
  <text x="560" y="303" fill="#94a3b8" font-family="monospace" font-size="11">SUCCESS RATE</text>

  <text x="110" y="345" fill="#f8fafc" font-family="sans-serif" font-size="12">Büyük Veri Analistliği</text>
  <text x="290" y="345" fill="#cbd5e1" font-family="monospace" font-size="12">1,420</text>
  <text x="430" y="345" fill="#38bdf8" font-family="monospace" font-size="12">3.48</text>
  <text x="560" y="345" fill="#34d399" font-family="monospace" font-size="12">94.2% [A+]</text>

  <text x="110" y="385" fill="#f8fafc" font-family="sans-serif" font-size="12">Bilgisayar Programcılığı</text>
  <text x="290" y="385" fill="#cbd5e1" font-family="monospace" font-size="12">2,850</text>
  <text x="430" y="385" fill="#38bdf8" font-family="monospace" font-size="12">3.22</text>
  <text x="560" y="385" fill="#34d399" font-family="monospace" font-size="12">89.6% [A]</text>
</svg>
