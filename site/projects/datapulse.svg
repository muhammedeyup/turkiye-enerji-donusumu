<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d18"/>
      <stop offset="100%" stop-color="#14192b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="barGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Grid Lines -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="80" y1="100" x2="720" y2="100"/>
    <line x1="80" y1="180" x2="720" y2="180"/>
    <line x1="80" y1="260" x2="720" y2="260"/>
    <line x1="80" y1="340" x2="720" y2="340"/>
    <line x1="80" y1="420" x2="720" y2="420"/>
  </g>

  <!-- Card Frame -->
  <rect x="50" y="40" width="700" height="420" rx="16" fill="rgba(255,255,255,0.02)" stroke="rgba(99,102,241,0.3)" stroke-width="1.5"/>

  <!-- Header Bar -->
  <circle cx="85" cy="70" r="5" fill="#ef4444"/>
  <circle cx="105" cy="70" r="5" fill="#f59e0b"/>
  <circle cx="125" cy="70" r="5" fill="#10b981"/>
  <text x="160" y="75" fill="#94a3b8" font-family="monospace" font-size="13">DataPulse // PySpark Stream Engine &amp; RFM</text>

  <!-- Metrics Chips -->
  <rect x="520" y="58" width="105" height="24" rx="6" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.4)"/>
  <text x="532" y="74" fill="#34d399" font-family="monospace" font-size="11">● 4.2M ROWS</text>

  <rect x="635" y="58" width="95" height="24" rx="6" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.4)"/>
  <text x="647" y="74" fill="#818cf8" font-family="monospace" font-size="11">LATENCY 12ms</text>

  <!-- Bar Charts -->
  <rect x="110" y="240" width="40" height="180" rx="6" fill="url(#barGlow)"/>
  <rect x="175" y="190" width="40" height="230" rx="6" fill="url(#barGlow)"/>
  <rect x="240" y="140" width="40" height="280" rx="6" fill="url(#barGlow)"/>
  <rect x="305" y="210" width="40" height="210" rx="6" fill="url(#barGlow)"/>
  <rect x="370" y="120" width="40" height="300" rx="6" fill="url(#barGlow)"/>
  <rect x="435" y="160" width="40" height="260" rx="6" fill="url(#barGlow)"/>

  <!-- Waveform Line Graph -->
  <path d="M 130 300 Q 200 160 260 220 T 400 150 T 550 250 T 680 140" fill="none" stroke="url(#glow)" stroke-width="4"/>
  <circle cx="260" cy="220" r="6" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
  <circle cx="400" cy="150" r="6" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
  <circle cx="550" cy="250" r="6" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
  <circle cx="680" cy="140" r="6" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>

  <!-- Floating Stats Box -->
  <rect x="520" y="280" width="200" height="120" rx="12" fill="rgba(19,22,36,0.9)" stroke="rgba(255,255,255,0.1)"/>
  <text x="540" y="310" fill="#94a3b8" font-family="sans-serif" font-size="11">CLUSTER EFFICIENCY</text>
  <text x="540" y="340" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="22">98.4%</text>
  <text x="540" y="375" fill="#38bdf8" font-family="monospace" font-size="11">↑ Real-Time Ingestion</text>
</svg>
