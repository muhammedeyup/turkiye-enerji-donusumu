  </defs>

  <rect width="800" height="500" fill="url(#finBg)"/>

  <!-- Candlesticks / Financial Chart Pattern -->
  <rect x="50" y="40" width="700" height="420" rx="16" fill="rgba(255,255,255,0.02)" stroke="rgba(16,185,129,0.3)" stroke-width="1.5"/>

  <!-- Top bar -->
  <circle cx="85" cy="70" r="5" fill="#ef4444"/>
  <circle cx="105" cy="70" r="5" fill="#f59e0b"/>
  <circle cx="125" cy="70" r="5" fill="#10b981"/>
  <text x="160" y="75" fill="#94a3b8" font-family="monospace" font-size="13">FinTrend // NLP Sentiment &amp; Algorithmic Market Predictor</text>

  <!-- Sentiment Chip -->
  <rect x="580" y="58" width="150" height="24" rx="6" fill="rgba(16,185,129,0.2)" stroke="rgba(16,185,129,0.5)"/>
  <text x="595" y="74" fill="#34d399" font-family="monospace" font-size="11">BULLISH (+78.4%)</text>

  <!-- Candlesticks -->
  <!-- Candle 1 -->
  <line x1="140" y1="200" x2="140" y2="350" stroke="#10b981" stroke-width="2"/>
  <rect x="130" y="230" width="20" height="80" rx="2" fill="#10b981"/>

  <!-- Candle 2 -->
  <line x1="190" y1="180" x2="190" y2="320" stroke="#ef4444" stroke-width="2"/>
  <rect x="180" y="210" width="20" height="70" rx="2" fill="#ef4444"/>

  <!-- Candle 3 -->
  <line x1="240" y1="150" x2="240" y2="300" stroke="#10b981" stroke-width="2"/>
  <rect x="230" y="170" width="20" height="90" rx="2" fill="#10b981"/>

  <!-- Candle 4 -->
  <line x1="290" y1="120" x2="290" y2="280" stroke="#10b981" stroke-width="2"/>
  <rect x="280" y="140" width="20" height="110" rx="2" fill="#10b981"/>

  <!-- Candle 5 -->
  <line x1="340" y1="170" x2="340" y2="310" stroke="#ef4444" stroke-width="2"/>
  <rect x="330" y="190" width="20" height="60" rx="2" fill="#ef4444"/>

  <!-- Trend Gradient Area -->
  <path d="M 140 260 L 240 200 L 340 220 L 440 160 L 540 130 L 680 90 L 680 400 L 140 400 Z" fill="url(#bullGreen)"/>
  <path d="M 140 260 L 240 200 L 340 220 L 440 160 L 540 130 L 680 90" fill="none" stroke="#10b981" stroke-width="3.5"/>

  <!-- Overlay HUD Panel -->
  <rect x="420" y="260" width="300" height="160" rx="14" fill="rgba(15,23,42,0.9)" stroke="rgba(255,255,255,0.1)"/>
  <text x="445" y="295" fill="#94a3b8" font-family="sans-serif" font-size="11">NLP SENTIMENT INDEX</text>
  <text x="445" y="328" fill="#10b981" font-family="sans-serif" font-weight="bold" font-size="24">Positive / Accumulate</text>
  <text x="445" y="360" fill="#e2e8f0" font-family="monospace" font-size="11">Sources: 12,450 Tweets &amp; News feeds</text>
  <text x="445" y="390" fill="#38bdf8" font-family="monospace" font-size="11">Confidence: 94.2% (Random Forest)</text>
