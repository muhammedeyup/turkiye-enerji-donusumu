<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 627" width="1200" height="627">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="50%" stop-color="#0b101d" />
      <stop offset="100%" stop-color="#05070c" />
    </linearGradient>

    <!-- Glowing Cyan Gradient -->
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#009e73" />
      <stop offset="70%" stop-color="#54D6FF" />
      <stop offset="100%" stop-color="#54D6FF" />
    </linearGradient>

    <!-- Fossil Orange Gradient -->
    <linearGradient id="fossilLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a5568" />
      <stop offset="50%" stop-color="#d55e00" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glowTop" cx="60%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#54D6FF" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#54D6FF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowBottom" cx="20%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#8B7CFF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#8B7CFF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="627" fill="url(#bgGrad)" />
  <rect width="1200" height="627" fill="url(#glowTop)" />
  <rect width="1200" height="627" fill="url(#glowBottom)" />

  <!-- Subtle Coordinate Grid -->
  <g stroke="rgba(255, 255, 255, 0.04)" stroke-width="1">
    <line x1="80" y1="120" x2="1120" y2="120" />
    <line x1="80" y1="220" x2="1120" y2="220" />
    <line x1="80" y1="320" x2="1120" y2="320" />
    <line x1="80" y1="420" x2="1120" y2="420" />
    <line x1="80" y1="520" x2="1120" y2="520" />
    <line x1="200" y1="80" x2="200" y2="540" />
    <line x1="450" y1="80" x2="450" y2="540" />
    <line x1="700" y1="80" x2="700" y2="540" />
    <line x1="950" y1="80" x2="950" y2="540" />
  </g>

  <!-- Top Badge -->
  <g transform="translate(80, 60)">
    <rect width="280" height="32" rx="16" fill="rgba(84, 214, 255, 0.1)" stroke="rgba(84, 214, 255, 0.3)" stroke-width="1" />
    <circle cx="20" cy="16" r="4" fill="#54D6FF" />
    <text x="32" y="21" fill="#54D6FF" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" letter-spacing="1">SCROLLYTELLING // VERİ HİKÂYESİ</text>
  </g>

  <!-- Main Finding Headline (H1) -->
  <text x="80" y="145" fill="#FFFFFF" font-family="'Syne', 'Space Grotesk', sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
    Rüzgâr ve Güneş Yükseliyor, Ancak Türkiye'nin
  </text>
  <text x="80" y="190" fill="#54D6FF" font-family="'Syne', 'Space Grotesk', sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
    Elektrik Şebekesini Hâlâ Fosil Yakıtlar Taşıyor
  </text>

  <!-- Subtitle -->
  <text x="80" y="235" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="17" font-weight="400">
    Our World in Data (1965–2025) Verileriyle 60 Yıllık Enerji Dönüşümü ve Dünya Ülkeleriyle Karşılaştırma
  </text>

  <!-- Graphic Curves Representation (Fossil vs Renewable 1965-2025) -->
  <g transform="translate(80, 260)">
    <!-- Baseline Axes -->
    <line x1="0" y1="240" x2="1040" y2="240" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />
    <text x="0" y="260" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="12">1965</text>
    <text x="320" y="260" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="12">1985 (Doğalgaz)</text>
    <text x="640" y="260" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="12">2006 (Rüzgâr)</text>
    <text x="860" y="260" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="12">2014 (Güneş)</text>
    <text x="1000" y="260" fill="#54D6FF" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">2025</text>

    <!-- Fossil Curve (Coal + Gas: rising from 0 to 200 TWh) -->
    <path d="M 0 238 Q 320 220 500 160 T 800 60 T 1040 45" fill="none" stroke="url(#fossilLine)" stroke-width="4.5" stroke-linecap="round" />

    <!-- Renewable Curve (Hydro + Wind + Solar: rising to 134 TWh) -->
    <path d="M 0 235 Q 320 215 500 190 T 800 150 T 1040 105" fill="none" stroke="url(#cyanLine)" stroke-width="4.5" stroke-linecap="round" />

    <!-- End Points and Values -->
    <circle cx="1040" cy="45" r="6" fill="#ef4444" stroke="#ffffff" stroke-width="2" />
    <text x="910" y="38" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">Fosil: 199,8 TWh (%59,9)</text>

    <circle cx="1040" cy="105" r="6" fill="#54D6FF" stroke="#ffffff" stroke-width="2" />
    <text x="870" y="110" fill="#54D6FF" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">Yenilenebilir: 133,9 TWh (%40,1)</text>

    <!-- Inflection annotations -->
    <g transform="translate(680, 165)">
      <rect width="130" height="24" rx="6" fill="rgba(0, 158, 115, 0.2)" stroke="#009e73" stroke-width="1" />
      <text x="10" y="16" fill="#009e73" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">Rüzgâr: 39,4 TWh</text>
    </g>
    <g transform="translate(850, 155)">
      <rect width="130" height="24" rx="6" fill="rgba(230, 159, 0, 0.2)" stroke="#e69f00" stroke-width="1" />
      <text x="10" y="16" fill="#e69f00" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">Güneş: 37,3 TWh</text>
    </g>
  </g>

  <!-- Footer Meta -->
  <g transform="translate(80, 570)">
    <text x="0" y="0" fill="#e2e8f0" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600">Muhammet Eyüp Çatan</text>
    <text x="175" y="0" fill="rgba(255, 255, 255, 0.3)">|</text>
    <text x="190" y="0" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="14">Büyük Veri Analistliği • Veri Gazeteciliği</text>
    <text x="960" y="0" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="12">1200 x 627 • OG PREVIEW</text>
  </g>
</svg>
